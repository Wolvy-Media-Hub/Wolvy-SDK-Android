name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew --no-daemon :wolvy-player:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :wolvy-player:lintDebug
      - name: Build the library and the sample
        run: ./gradlew --no-daemon :wolvy-player:assembleRelease :sample:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: wolvy-player/build/reports/
